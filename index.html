<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>การ์ดประวัติส่วนตัวนักเรียน - ธนรักษ์ ปาวิลา</title>
    <style>
        /* CSS Reset & Variable Setup */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #2c3e50;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Container & Layout */
        .page-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #e1e8ed;
        }

        /* Header Section Style */
        .profile-header {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: #ffffff;
            padding: 30px;
            position: relative;
            border-bottom: 5px solid #60a5fa;
        }

        .header-content {
            display: flex;
            align-items: center;
        }

        .avatar-placeholder {
            width: 90px;
            height: 90px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .info-cell {
            flex-grow: 1;
        }

        .student-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #bfdbfe;
            margin: 0 0 5px 0;
            font-weight: 600;
        }

        .student-name {
            font-size: 28px;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .student-school {
            font-size: 16px;
            color: #eff6ff;
            margin: 0;
            font-weight: 400;
        }

        /* Layout Grid */
        .profile-body {
            padding: 25px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Section Cards Styling */
        .info-section {
            background-color: #f8fafc;
            border-left: 4px solid #3b82f6;
            padding: 18px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            break-inside: avoid;
        }

        .section-title {
            font-size: 16px;
            color: #1e3a8a;
            margin: 0 0 12px 0;
            font-weight: 700;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        /* Data Rows */
        .data-row {
            display: flex;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .data-row:last-child {
            margin-bottom: 0;
        }

        .data-label {
            width: 40%;
            font-weight: 600;
            color: #64748b;
        }

        .data-value {
            width: 60%;
            color: #334155;
        }

        /* Tags / Pills Display */
        .tag-pill {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        .tag-pill.negative {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .tag-pill.hobby {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        /* Motto Section */
        .motto-box {
            background: linear-gradient(to right, #eff6ff, rgba(219, 234, 254, 0));
            border-left: 4px solid #8b5cf6;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 10px;
            text-align: center;
            break-inside: avoid;
        }

        .motto-title {
            font-size: 12px;
            color: #6d28d9;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 6px 0;
            font-weight: 700;
        }

        .motto-text {
            font-size: 18px;
            font-style: italic;
            color: #4c1d95;
            margin: 0;
            font-weight: 600;
        }

        /* Page Configuration for A4 Printability */
        @media print {
            @page {
                size: A4;
                margin: 15mm 12mm;
            }
            body {
                background-color: #ffffff;
                padding: 0;
            }
            .page-container {
                box-shadow: none;
                border: none;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="profile-header">
            <div class="header-content">
                <div class="avatar-placeholder">พ</div>
                <div class="info-cell">
                    <p class="student-title">STUDENT PROFILE CARD</p>
                    <h1 class="student-name">เด็กชาย ธนรักษ์ ปาวิลา (พอตเตอร์)</h1>
                    <p class="student-school">โรงเรียนจอมทอง &bull; ระดับชั้น ม.3</p>
                </div>
            </div>
        </div>

        <div class="profile-body">
            <div class="main-layout">
                
                <div class="column-left">
                    <div class="info-section">
                        <h2 class="section-title">ข้อมูลทั่วไป (General Info)</h2>
                        <div class="data-row">
                            <div class="data-label">วันเกิด:</div>
                            <div class="data-value">22 ตุลาคม 2554</div>
                        </div>
                        <div class="data-row">
                            <div class="data-label">เพศ:</div>
                            <div class="data-value">ชาย</div>
                        </div>
                        <div class="data-row">
                            <div class="data-label">ส่วนสูง:</div>
                            <div class="data-value">174 ซม.</div>
                        </div>
                        <div class="data-row">
                            <div class="data-label">กรุ๊ปเลือด:</div>
                            <div class="data-value">-</div>
                        </div>
                        <div class="data-row">
                            <div class="data-label">ราศี:</div>
                            <div class="data-value">ราศีตุลย์</div>
                        </div>
                        <div class="data-row">
                            <div class="data-label">ภูมิลำเนา:</div>
                            <div class="data-value">เชียงใหม่</div>
